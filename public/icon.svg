<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EF"/>
      <stop offset="100%" stop-color="#F1E7D5"/>
    </linearGradient>

    <!-- Teal/Blue Brand Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Deep Blue Shadow Gradient -->
    <linearGradient id="deepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0C4A6E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#E2D4BC" stroke-width="2" opacity="0.6"/>

  <g transform="translate(256, 256) scale(0.92) translate(-256, -256)" filter="url(#shadow)">
    <!-- Head Silhouette -->
    <path d="M 215 130
             C 170 130, 135 165, 135 210
             C 135 238, 148 262, 168 278
             L 165 305
             C 165 310, 155 315, 142 322
             C 130 329, 125 338, 132 344
             C 138 349, 158 345, 172 342
             L 182 360
             C 188 370, 196 385, 202 400
             C 214 430, 240 455, 270 450
             C 255 435, 245 405, 248 375
             C 250 355, 260 338, 255 315
             C 250 292, 230 282, 225 255
             C 220 228, 242 205, 242 175
             C 242 145, 230 130, 215 130 Z"
          fill="url(#tealGrad)"/>

    <!-- Dynamic Neck Curl Accent -->
    <path d="M 248 375
             C 260 345, 280 325, 275 300
             C 270 275, 250 265, 242 245
             L 242 270
             C 242 300, 265 330, 250 365
             C 245 378, 235 390, 228 402
             C 242 425, 258 440, 270 450
             C 255 435, 245 405, 248 375 Z"
          fill="url(#deepGrad)" opacity="0.85"/>

    <!-- "LA" Monogram Center -->
    <!-- The L and A combined structure -->
    <path d="M 222 175
             L 222 278
             L 272 278
             L 272 262
             L 238 262
             L 238 175 Z"
          fill="#0284C7"/>

    <path d="M 268 280
             L 310 178
             L 326 178
             L 368 280
             L 350 280
             L 338 250
             L 296 250
             L 284 280 Z
             M 302 235
             L 332 235
             L 317 198 Z"
          fill="#0D9488"/>

    <!-- Neural Network Brain Lines -->
    <g stroke="url(#tealGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="285" y1="140" x2="330" y2="155"/>
      <line x1="330" y1="155" x2="375" y2="175"/>
      <line x1="375" y1="175" x2="410" y2="215"/>
      <line x1="410" y1="215" x2="400" y2="265"/>
      <line x1="400" y1="265" x2="368" y2="305"/>
      <line x1="368" y1="305" x2="320" y2="315"/>
      <line x1="320" y1="315" x2="295" y2="360"/>
      <line x1="320" y1="315" x2="365" y2="370"/>
      <line x1="295" y1="360" x2="340" y2="400"/>
      <line x1="365" y1="370" x2="340" y2="400"/>
      <line x1="330" y1="155" x2="335" y2="215"/>
      <line x1="375" y1="175" x2="350" y2="240"/>
      <line x1="400" y1="265" x2="345" y2="270"/>
    </g>

    <!-- Neural Network Nodes (Circles) -->
    <g fill="url(#tealGrad)">
      <circle cx="285" cy="140" r="11"/>
      <circle cx="330" cy="155" r="13"/>
      <circle cx="375" cy="175" r="14"/>
      <circle cx="410" cy="215" r="13"/>
      <circle cx="400" cy="265" r="14"/>
      <circle cx="368" cy="305" r="13"/>
      <circle cx="320" cy="315" r="12"/>
      <circle cx="295" cy="360" r="13"/>
      <circle cx="365" cy="370" r="12"/>
      <circle cx="340" cy="400" r="14"/>
    </g>

    <!-- Golden Intelligence Nodes -->
    <g fill="url(#goldGrad)">
      <circle cx="265" cy="165" r="9"/>
      <circle cx="395" cy="190" r="8"/>
      <circle cx="325" cy="285" r="10"/>
      <circle cx="218" cy="315" r="8"/>
      <circle cx="232" cy="395" r="9"/>
      <circle cx="355" cy="430" r="8"/>
    </g>
  </g>
</svg>
